# Central configuration for the antibiotic-resistance-ai project.
# Every script reads this file; values below should not be hard-coded elsewhere.

project:
  name: antibiotic-resistance-ai
  version: "0.7.0"
  random_seed: 42

paths:
  # DRIAMS lives OUTSIDE the repository (it is ~145 GB compressed).
  # Override with the environment variable DRIAMS_ROOT if you store it elsewhere.
  driams_root: "C:/DRIAMS"
  archives_subdir: archives        # downloaded .tar.gz files
  manifests_subdir: manifests      # one CSV per site listing every file inside the archive
  eda_metrics_dir: results/metrics/eda
  eda_plots_dir: results/plots/eda

# Verified on 2026-09-16 against the Zenodo API (record 5640517) and the Dryad API
# (doi:10.5061/dryad.bzkh1899q, version 383184).
# DRIAMS_A/B/D have identical sizes on both hosts. DRIAMS_C was re-uploaded to Dryad in
# Aug 2025 (raw-file naming fix), so the Zenodo copy of C is outdated and is not used.
driams:
  archives:
    A:
      site: DRIAMS-A
      institution: University Hospital Basel
      period: "11/2015-08/2018"
      filename: DRIAMS_A.tar.gz
      url: "https://zenodo.org/records/5640517/files/DRIAMS_A.tar.gz?download=1"
      size_bytes: 86161411795
      checksum_type: md5
      checksum: ca32ee8893afd57f6e80f4d7f3a37cf1
    B:
      site: DRIAMS-B
      institution: Canton Hospital Basel-Land
      period: "01/2018-06/2018"
      filename: DRIAMS_B.tar.gz
      url: "https://zenodo.org/records/5640517/files/DRIAMS_B.tar.gz?download=1"
      size_bytes: 3688166065
      checksum_type: md5
      checksum: 86ef245c53b1a2cf547d04dee1dc79ea
    C:
      site: DRIAMS-C
      institution: Canton Hospital Aarau
      period: "01/2018-08/2018"
      filename: DRIAMS_C.tar.gz
      # Dryad blocks scripted downloads (HTTP 401/403). Download it in a browser from the
      # page below, then register it with:
      #   python scripts/download_driams.py --site C --from-file <path-to-downloaded-file>
      url: null
      manual_download_page: "https://datadryad.org/dataset/doi:10.5061/dryad.bzkh1899q"
      size_bytes: 12433273727
      checksum_type: sha256
      checksum: 77c8097eeb09e9c07397d94b5d888684ca5421d76e4567e1d67fdd75685b7867
    D:
      site: DRIAMS-D
      institution: Viollier AG (diagnostic laboratory)
      period: "01/2018-06/2018"
      filename: DRIAMS_D.tar.gz
      url: "https://zenodo.org/records/5640517/files/DRIAMS_D.tar.gz?download=1"
      size_bytes: 42557466856
      checksum_type: md5
      checksum: 21483b6232da155edc324febe5208ee1

  # Sub-folders inside every site folder (DRIAMS README).
  spectra_folders: [raw, preprocessed, binned_6000]
  id_folder: id
  # Metadata table per year: id/<year>/<year>_<suffix>.csv, first existing suffix wins.
  # Checked 2026-09-16: DRIAMS-A has both <year>_clean.csv and <year>_strat.csv for 2015-2018 with
  # the same rows and identical antibiotic values (0 differing cells); strat adds acquisition_date,
  # acquisition_time, case_no, order_no, patient_no and workstation. DRIAMS-B only has clean.
  id_suffixes: [strat, clean]
  # Non-antibiotic columns. patient_no / case_no / order_no are 32-character hashes that never
  # repeat across DRIAMS-A years (re-hashed per year), so patients can only be grouped within a year.
  # Not every site has every column: DRIAMS-B has only species, code and combined_code (empty);
  # DRIAMS-D (checked 2026-09-17) has only code, species and genus.
  metadata_columns: [id, code, combined_code, species, genus, laboratory_species, patient_no, case_no, order_no,
                     acquisition_date, acquisition_time, workstation]
  # Grouping key for leakage checks (first column present wins).
  group_columns: [patient_no, case_no]
  # Leftover pandas index columns such as "Unnamed: 0" (DRIAMS-A 2018) are ignored.
  index_artifact_prefix: "Unnamed:"
  # Antibiotic names are NOT fully harmonised across sites (checked 2026-09-16): DRIAMS-A uses
  # Cotrimoxazole / Ampicillin-Amoxicillin / Fosfomycin-Trometamol where DRIAMS-B uses Cotrimoxazol /
  # Ampicillin / Fosfomycin. Ciprofloxacin and Ceftriaxone are spelled identically. No automatic
  # renaming is done; any mapping must be added explicitly and justified.
  # Screening results stored as 0/1 instead of R/I/S (DRIAMS-B: ESBL, MRSA, Cefoxitin_screen,
  # Clindamycin_induced). Reported separately; never used as antibiotic targets.
  binary_marker_values: ["0", "1"]
  # Species entries that are identification failures or mixed cultures (seen in DRIAMS-B).
  failed_identification_species: ["no peaks found"]
  mixed_species_prefix: "MIX!"
  # binned_6000 files: header "bin_index binned_intensity", 6000 rows (verified on DRIAMS-B).
  n_bins: 6000

labels:
  # Susceptible = 0, Resistant = 1.
  # Weis et al. (2022) labelled intermediate (I) as resistant (class 1). We follow that
  # convention and report I counts separately so its effect is visible.
  intermediate_as: resistant        # resistant | susceptible | exclude
  # Bracketed / mixed entries are ambiguous (maldi-learn maps them to NaN).
  ambiguous_values: ["S(2)", "R(1)", "R(2)", "L(1)", "I(1)", "I(1), S(1)", "R(1), I(1)",
                     "R(1), S(1)", "R(1), I(1), S(1)"]
  missing_values: ["-", ""]

target:
  species: Escherichia coli
  preferred_antibiotic: Ciprofloxacin
  # Sanity-check pair reported next to the main pair: Weis et al. (2022) report AUROC 0.74 for
  # E. coli + Ceftriaxone on DRIAMS-A, which gives our later models a published reference point.
  benchmark_antibiotic: Ceftriaxone

# Pre-registered eligibility rules for choosing the species-antibiotic pair.
# Fixed BEFORE looking at DRIAMS-A so the choice is not tuned to the results.
pair_selection:
  development_site: DRIAMS-A
  min_resistant_dev: 500            # class-1 samples (R, plus I when intermediate_as=resistant)
  min_susceptible_dev: 500
  min_minority_fraction: 0.10
  min_years_with_labels: 3          # out of the DRIAMS-A years
  temporal_test_year: "2018"
  min_resistant_test_year: 50
  external_sites: [DRIAMS-B, DRIAMS-C, DRIAMS-D]
  min_per_class_external: 30
  min_external_sites: 2

extraction:
  # Folders pulled out of each archive in V0.1 (raw spectra are extracted per species in V0.2).
  default_folders: [id, binned_6000]
  min_free_disk_gb: 20

# ------------------------------------------------------------------------------------------------
# Version 0.2 - spectrum preprocessing (stateless: every spectrum is processed on its own).
# Reproduces the DRIAMS pipeline: R scripts amr_maldi_ml/DRIAMS_preprocessing/*_preprocessed.r in
# BorgwardtLab/maldi_amr, run with MALDIquant (algorithms checked against MALDIquant 1.22.3):
#   transformIntensity(sqrt) -> smoothIntensity(SavitzkyGolay, halfWindowSize=10)
#   -> removeBaseline(removeBaseline(., SNIP, iterations=20))   # outer call = SNIP, 100 iterations
#   -> calibrateIntensity(TIC over the full spectrum) -> trim(2000, 20000)
# plus DRIAMS binning: sum of intensities in 3 Da bins [2000, 20000] -> 6000 features.
# Checked on 25 DRIAMS-B E. coli spectra: max relative difference 7.6e-14 to the published
# preprocessed and binned_6000 files (a single SNIP pass differs by 5e-5).
# ------------------------------------------------------------------------------------------------
preprocessing:
  spectrum_folder: raw              # input folder inside each site
  min_raw_points: 100               # fewer points = malformed spectrum
  intensity_transform: sqrt         # sqrt | none
  smoothing:
    method: savitzky_golay          # savitzky_golay | none
    half_window_size: 10
    polynomial_order: 3
  baseline:
    method: snip                    # snip | none
    iterations: [20, 100]           # applied one after another, as in the DRIAMS scripts
  normalization: tic                # tic | none   (trapezoidal area of the whole spectrum)
  mz_min: 2000.0
  mz_max: 20000.0
  bin_width: 3.0                    # (mz_max - mz_min) / bin_width must be a whole number
  dtype: float32

dataset:
  name: ecoli_ciprofloxacin         # output folder under output_dir
  output_dir: data/processed        # git-ignored
  # species and antibiotic come from target.species / target.preferred_antibiotic;
  # the intermediate (I) policy comes from labels.intermediate_as.
  sites: [DRIAMS-A, DRIAMS-B, DRIAMS-D]   # add DRIAMS-C here once downloaded and extracted
  # Screening samples excluded from the primary cohort (kept in the exclusion list, never deleted).
  # Sites without a workstation column (DRIAMS-B, DRIAMS-D) cannot be filtered this way.
  exclude_workstations: [HospitalHygiene]
  require_acquisition_date: false   # only temporal splits need it; they check it themselves
  flag_duplicate_spectra: true      # identical processed vectors: keep the first, exclude the rest
  # Compare every processed spectrum with the published DRIAMS binned_6000 file for the same code
  # (only when the preprocessing settings are the DRIAMS ones). Checked 2026-09-16: 4,472 of 4,483
  # E. coli ciprofloxacin spectra agree to <= 5e-8; 11 DRIAMS-A codes differ by 6-38 % because the
  # raw and the binned file hold different measurements, so the label cannot be tied to the raw file.
  verify_against_driams_binned: true
  verification_tolerance: 1.0e-4    # max |ours - DRIAMS| / max(DRIAMS)
  chunk_size: 256                   # spectra processed before flushing to disk

splits:
  # All splits keep patient groups together where a patient ID exists (DRIAMS-A: patient_no,
  # which is re-hashed per year folder, so the same person in two years cannot be detected).
  # Only the primary dataset (dataset.name) gets these splits; every other dataset built from the
  # same data (e.g. --intermediate-as exclude) reuses the primary dataset's saved splits.
  random:
    sites: [DRIAMS-A]
    test_fraction: 0.2
    validation_fraction: 0.1        # of all samples, taken from the non-test part
  within_year:
    # Like `random`, but inside one year folder, where patient_no is consistent, so no patient can be
    # in two parts. Comparing it with `random` shows how much cross-year patient overlap may inflate
    # random-split results. Checked 2026-09-17: 76 % of DRIAMS-A E. coli spectra (3,247 / 4,259) come
    # from patients with more than one spectrum in the same year. 2017 is the largest year folder
    # (1,833 samples, 428 resistant, 865 patient groups).
    sites: [DRIAMS-A]
    year_folder: "2017"             # a grouping scope, not a time split (those use acquisition_date)
    test_fraction: 0.2
    validation_fraction: 0.1
  temporal:
    sites: [DRIAMS-A]
    date_column: acquisition_date   # never the year folder
    validation_start: "2017-10-01"  # train < validation_start <= validation < test_start
    test_start: "2018-01-01"
  external:
    train_sites: [DRIAMS-A]
    # One test part holding every external site; results are reported per site (their resistance
    # rates differ: B 27.7 %, D 19.1 % of E. coli with a ciprofloxacin result).
    test_sites: [DRIAMS-B, DRIAMS-D]  # add DRIAMS-C when available
    validation_fraction: 0.1
  external_ab:
    # The specification's "train two sites, test a third" experiment (protocol amendment 3, point 1).
    # B is a *training* site here and a test site in `external`, so the same DRIAMS-D rows are scored
    # under two training regimes on purpose; the difference is compared with a paired bootstrap.
    train_sites: [DRIAMS-A, DRIAMS-B]
    test_sites: [DRIAMS-D]
    validation_fraction: 0.1

evaluation:
  # Fixed in docs/evaluation_protocol.md (approved 2026-09-17) before any model was trained.
  threshold:
    rule: min_sensitivity             # highest cut-off whose validation sensitivity for resistance >= target
    min_sensitivity: 0.90
  primary_metric: roc_auc             # PR-AUC is reported next to it (co-primary)
  bootstrap:
    resamples: 2000                   # whole patient groups resampled within the test part
    level: 0.95
    seed: 42
  calibration_bins: 10                # equal-count bins for reliability plots
  # Protocol decision 7 locked the `temporal` and `external` test parts so they could not influence any
  # model choice in Versions 0.3-0.6, and released them at Version 0.7, the generalisation experiment.
  # Released on 2026-09-23 by scripts/measure_generalisation.py (docs/v0.7_generalisation_plan.md); the
  # guard itself stays in place, so putting a split back in this list still refuses it everywhere.
  locked_test_splits: []
  test_log: results/experiments/test_evaluations.csv   # append-only, one row per test evaluation
  timing_samples: 200                 # validation spectra timed end to end (read + preprocess + predict)

baselines:
  # Version 0.3: fixed settings chosen before training; nothing is tuned here (tuning is Version 0.4).
  splits: [random, within_year]
  size_matched:                       # patient-overlap check: `split` trained on a patient-grouped random
    split: random                     # subsample of its training part, as large as the training part
    size_of: within_year              # of `size_of`
  seeds: [42, 43, 44, 45, 46]         # stochastic models run once per seed; seed 42 is reported and saved
  model_dir: models/v0.3              # git-ignored
  report_dir: results/metrics/v0.3
  plot_dir: results/plots/v0.3
  models:
    prevalence:                       # always predicts the training resistance rate (no-skill reference)
      kind: dummy
    logistic_regression:
      kind: logistic_regression
      scale: true                     # StandardScaler, fitted on training rows only
      params: {C: 1.0, max_iter: 5000}   # scikit-learn default L2 strength
    random_forest:
      kind: random_forest
      stochastic: true
      params: {n_estimators: 500}     # R randomForest default; more trees only reduce variance
    lightgbm:
      # LightGBM 4.7 defaults (100 trees, learning rate 0.1, 31 leaves, no row or column subsampling).
      # Checked 2026-09-17: with these settings training is deterministic (seeds 42 and 43 gave identical
      # probabilities), so it is trained once.
      kind: lightgbm
      params: {}

tuning:
  # Version 0.4, fixed before any tuning run (docs/v0.4_search_plan.md).
  split: random                       # searched, calibrated and compared on this split
  cv_folds: 5                         # StratifiedGroupKFold inside the training part (patient groups intact)
  cv_seed: 42
  search_metric: roc_auc              # mean over folds; ties -> the configuration listed first
  calibration: sigmoid                # fitted on out-of-fold predictions of the same folds (training part only)
  seeds: [42, 43, 44, 45, 46]         # stochastic families; seed 42 is reported and can be saved
  retune_experiments: [within_year, random_size_matched]   # chosen family only (patient-overlap check)
  model_dir: models/v0.4              # git-ignored; also holds the cache of searches and fitted models
  report_dir: results/metrics/v0.4
  plot_dir: results/plots/v0.4
  families:
    logistic_regression:
      kind: logistic_regression
      n_jobs: 4                       # folds in parallel (the model itself is single-threaded)
      grid:
        - features: [bins_3da, bins_18da, pca_50, pca_200, kbest_300, kbest_1000]
          penalty: [l2]
          C: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0, 100.0]
          class_weight: [null, balanced]
        - features: [bins_3da, bins_18da]
          penalty: [l1]                 # embedded feature selection
          C: [0.01, 0.1, 1.0, 10.0]
          class_weight: [null, balanced]
    random_forest:
      kind: random_forest
      n_jobs: 1                       # the forest itself uses all CPU threads
      stochastic: true
      fixed: {n_estimators: 500}
      grid:
        - max_features: [sqrt, log2, 0.05]
          min_samples_leaf: [1, 3, 10]
          class_weight: [null, balanced_subsample]
    lightgbm:
      kind: lightgbm
      n_jobs: 1
      stochastic: true                # row and column subsampling depend on the seed
      fixed: {subsample_freq: 1}
      random_draws: 30                # drawn with cv_seed from the lists below
      space:
        n_estimators: [100, 300, 600]
        learning_rate: [0.01, 0.03, 0.1]
        num_leaves: [7, 15, 31]
        min_child_samples: [10, 20, 40]
        colsample_bytree: [0.1, 0.3, 1.0]
        subsample: [0.7, 1.0]
        reg_lambda: [0.0, 1.0, 10.0]
        class_weight: [null, balanced]
    svm_rbf:
      # Version 0.4 only: lowest scores, 84 min to search, ~400x slower to predict than LightGBM.
      # Dropped from Version 0.5 onwards (docs/v0.5_deep_learning_plan.md); its results stay in the tables.
      kind: svm_rbf
      n_jobs: 4
      grid:
        - C: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
          gamma: [1.0e-5, 1.0e-4, 1.0e-3]
          class_weight: [null, balanced]

deep:
  # Version 0.5, fixed before any network was trained (docs/v0.5_deep_learning_plan.md).
  split: random                       # searched, calibrated and compared on this split
  cv_folds: 5                         # the same patient-grouped folds as Version 0.4
  cv_seed: 42
  search_metric: roc_auc
  calibration: sigmoid                # on out-of-fold predictions of the training part
  seeds: [42, 43, 44, 45, 46]         # networks are stochastic; seed 42 is reported and can be saved
  model_dir: models/v0.5              # git-ignored; also holds the cache
  report_dir: results/metrics/v0.5
  plot_dir: results/plots/v0.5
  compare_with: models/v0.4           # the Version 0.4 model, re-scored for a paired comparison
  training:
    max_epochs: 60
    batch_size: 64
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    patience: 8                       # epochs without inner-validation improvement before stopping
    inner_validation_fraction: 0.15   # split of the training part used only for early stopping
    threads: 8                        # CPU threads for PyTorch (the laptop has 12)
  families:
    mlp:
      kind: mlp
      stochastic: true
      grid:
        - features: [bins_3da, bins_18da]
          hidden: ["256,64", "512,128"]
          dropout: [0.2, 0.5]
          positive_class_weight: [false, true]
    cnn:
      kind: cnn
      stochastic: true
      grid:
        - features: [bins_3da]        # full resolution: 3.7 s per epoch, so only two settings
          channels: ["16,32"]
          kernel_size: [9, 25]
          dropout: [0.3]
          positive_class_weight: [true]
        - features: [bins_18da]       # coarser bins: 0.7 s per epoch
          channels: ["16,32", "32,64"]
          kernel_size: [9, 15]
          dropout: [0.3]
          positive_class_weight: [true]

explain:
  # Version 0.6, fixed before any explanation was computed (docs/v0.6_explainability_plan.md).
  # Nothing here may change a model, a setting or a cut-off; explanations describe the saved model.
  model_dir: models/v0.4              # the project's model: the Version 0.4 tuned LightGBM
  split: random                       # which saved bundle: best_<split>.joblib
  rows: validation                    # the only part explanations may be computed on
  seeds: [42, 43, 44, 45, 46]         # cached fits of the same setting, used for stability only
  report_dir: results/metrics/v0.6
  plot_dir: results/plots/v0.6
  regions:
    top_bins: 100                     # most important bins kept before merging
    merge_gap_bins: 2                 # bins at most this far apart become one m/z region
    report_regions: 20                # regions shown in the tables
  permutation:
    block_bins: 6                     # 18 Da blocks: neighbouring bins of one peak are correlated
    repeats: 5
    seed: 42
    top_single_bins: 50               # single-bin permutation, top SHAP bins only (cross-check)
  cross_model: models/v0.5            # same permutation importance on the Version 0.5 MLP
  null_control:
    label_shuffle_seed: 42            # one refit on permuted training labels: the noise floor
  uncertainty:
    # Three-way output. Both edges are fitted on validation; the targets and the coverage floor are
    # pre-registered, and are NOT lowered if a side cannot reach them (the report says so instead).
    target_precision: 0.95            # high-confidence resistant: >= 95 % of those calls truly resistant
    target_npv: 0.95                  # high-confidence susceptible: >= 95 % truly susceptible
    min_coverage: 0.05                # a zone must cover >= 5 % of rows to be reported at all

generalisation:
  # Version 0.7, fixed before any locked test part was scored (docs/v0.7_generalisation_plan.md,
  # protocol amendment 3). This version spends the `temporal` and `external` test parts that
  # decision 7 locked until now. It changes no model and no setting: the hyperparameters below are
  # read from the Version 0.4 winning model card, never re-searched, so a gap between experiments
  # can only come from the data.
  source_model: models/v0.4             # where the winning setting and the saved bundle come from
  source_split: random                  # which saved bundle: best_<split>.joblib
  experiments: [temporal, external, external_ab]   # refit the fixed setting on each of these
  reuse_logged: [random, within_year]   # reference rows taken from the existing test log, not re-scored
  score_saved_model_on: [external]      # the saved bundle, no refit; leakage-checked splits only
  seeds: [42, 43, 44, 45, 46]           # protocol decision 6: mean and range, intervals for seed 42
  model_dir: models/v0.7
  report_dir: results/metrics/v0.7
  plot_dir: results/plots/v0.7
  zone_transfer:
    # Apply the Version 0.6 edge unchanged to each new test part. Never refitted there: that would
    # need the new site's labels and is a different experiment (amendment 3, point 5).
    zones: results/metrics/v0.6         # where uncertainty.json was written
    target_npv: 0.95                    # the pre-registered reading: >= 0.95, or interval covering it
  shift_diagnostic:
    # Feature-only, no AST label, computed after every scoring is logged, so it cannot influence a
    # model or a threshold. It describes the shift; it does not correct for it.
    low_mz_bins: 20                     # reported separately: D starts ~2,000 Da, A and B ~1,960 Da
    regions_from: results/metrics/v0.6  # the Version 0.6 top regions the model actually relies on

reservation:
  # Data deliberately kept out of a version so a later version can still ask a question that needs
  # unspent labels. Fixed in docs/v0.7_generalisation_plan.md (addendum 2026-09-24) before the Version 0.7
  # run, with no result of it seen.
  #
  # DRIAMS-C is not on disk: it needs a 12.43 GB browser download from Dryad, whose API refuses scripted
  # downloads (401, re-checked 2026-09-23). Version 0.7 therefore runs on A, B and D, and C is reserved
  # rather than rushed. After Version 0.7 has scored them, B and D can no longer answer "does adapting to
  # a NEW site help?", because their labels have been spent.
  driams_c:
    site: DRIAMS-C
    reserved_for: "0.8"               # adaptive AI: the target domain it adapts to
    used_in_v07: false                # no scoring, no threshold, no zone, no diagnostic
    # Fixed now, before the contents of C are seen. Whole patient groups where C has a patient
    # identifier, otherwise whole spectra.
    adaptation_fraction: 0.70         # Version 0.8 may fit on this part
    holdout_fraction: 0.30            # and must score this part once
    seed: 42
    # If C fails the pre-registered pair-selection rule, that is reported with its counts and Version 0.8
    # falls back to a partition of DRIAMS-D declared in its own plan, stating that those spectra were
    # already scored once in Version 0.7 under different models.
    fallback_site: DRIAMS-D
    # Adding C later must never rebuild the primary dataset (protocol amendment 3, point 4) and never
    # re-date Version 0.7: it is reported as a dated addendum.
    rebuilds_primary_dataset: false

adaptation:
  # Version 0.8, APPROVED 2026-09-24 (docs/v0.8_adaptive_plan.md, protocol amendment 4). Every
  # methodology-critical value is fixed here BEFORE DRIAMS-C was opened. Changing any of them after an
  # evaluation result exists would void the pre-registration.
  cohort:
    site: DRIAMS-C
    name: ecoli_ciprofloxacin__site-C     # a SEPARATE cohort; the primary dataset is never rebuilt
    archive_checksum: 77c8097eeb09e9c07397d94b5d888684ca5421d76e4567e1d67fdd75685b7867
    # Must equal the primary dataset's, or C was built with other preprocessing and is not comparable.
    require_feature_fingerprint: 347cbd6d5d956ff9
  eligibility:
    # E1 is the existing pre-registered site rule (pair_selection.min_per_class_external).
    # E2 is the Version 0.8 power precondition on the part that carries the result.
    e1_min_per_class_site: 30
    e2_min_per_class_holdout: 30
    on_failure: stop                      # never relax the rule, never substitute another site
  partition:
    adaptation_fraction: 0.70
    holdout_fraction: 0.30
    seed: 42
    unit: patient_group                   # whole groups; a spectrum without an ID is its own group
    method: grouped_subsample             # the existing tested function
  baseline:
    # B1, the primary baseline: the saved project model, unchanged, with the carried-over Version 0.6 edge.
    model_dir: models/v0.4
    split: random
    zones: results/metrics/v0.6           # the carried-over edge; NEVER refitted for the baseline
    secondary_model_dir: models/v0.7      # B2, the Version 0.7 `external` refit
  arms:
    primary: recalibrated                 # Platt (a, b) + zone edge refitted on the adaptation part only
    secondary: refit_a_plus_c             # confirmatory, NOT exploratory; same success/failure rules
    recalibration_method: platt_sigmoid   # sklearn _SigmoidCalibration, as CalibratedClassifierCV uses
    frozen_under_recalibration: [model, preprocessing, features, threshold_rule]
    hyperparameter_search_on_c: false     # rejected in the plan; must stay false
    adaptation_size: full                 # ONE fixed size for the primary; no selection on the held-out set
    learning_curve_fractions: [0.25, 0.50, 0.75, 1.00]   # by CV INSIDE the adaptation part only
    learning_curve_scored_on_holdout: false              # must stay false: it would spend the protected set
  endpoints:
    primary: brier                        # (1/n) * sum (p_i - y_i)^2, lower is better
    primary_direction: lower_is_better
    coprimary: confidence_zone
    zone_target_npv: 0.95
    zone_coverage_slack: 0.05             # adapted coverage >= baseline coverage - 0.05
    zone_baseline: B1                     # whose coverage the floor is measured against
    secondary: [roc_auc, pr_auc, npv_susceptible, share_susceptible, calibration_slope,
                calibration_intercept, sensitivity, specificity, balanced_accuracy]
    auroc_is_a_guardrail_not_an_endpoint: true   # recalibration cannot move it (monotone map)
  statistics:
    paired: true                          # both models scored on the same held-out rows
    bootstrap_resamples: 2000
    bootstrap_seed: 42
    level: 0.95
    resample_unit: patient_group
    multiple_comparison: holm
    holm_arms: [recalibrated, refit_a_plus_c]
    holm_alpha: 0.05
  decision:
    # Arithmetic, and the only vocabulary the report may use.
    outcomes: [success, "not demonstrated", harm, mixed]
    success: "brier interval excludes 0 favourably AND the zone pair holds"
    null_result: "brier interval includes 0"
    harm: "brier interval excludes 0 unfavourably OR the adapted zone falls below target where B1 held"
    mixed: "brier interval excludes 0 favourably AND the zone pair fails"


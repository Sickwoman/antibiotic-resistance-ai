# Central configuration for the antibiotic-resistance-ai project.
# Every script reads this file; values below should not be hard-coded elsewhere.

project:
  name: antibiotic-resistance-ai
  version: "0.3.0"
  random_seed: 42

paths:
  # DRIAMS lives OUTSIDE the repository (it is ~145 GB compressed).
  # Override with the environment variable DRIAMS_ROOT if you store it elsewhere.
  driams_root: "C:/DRIAMS"
  archives_subdir: archives        # downloaded .tar.gz files
  manifests_subdir: manifests      # one CSV per site listing every file inside the archive
  eda_metrics_dir: results/metrics/eda
  eda_plots_dir: results/plots/eda

# Verified on 2026-09-16 against the Zenodo API (record 5640517) and the Dryad API
# (doi:10.5061/dryad.bzkh1899q, version 383184).
# DRIAMS_A/B/D have identical sizes on both hosts. DRIAMS_C was re-uploaded to Dryad in
# Aug 2025 (raw-file naming fix), so the Zenodo copy of C is outdated and is not used.
driams:
  archives:
    A:
      site: DRIAMS-A
      institution: University Hospital Basel
      period: "11/2015-08/2018"
      filename: DRIAMS_A.tar.gz
      url: "https://zenodo.org/records/5640517/files/DRIAMS_A.tar.gz?download=1"
      size_bytes: 86161411795
      checksum_type: md5
      checksum: ca32ee8893afd57f6e80f4d7f3a37cf1
    B:
      site: DRIAMS-B
      institution: Canton Hospital Basel-Land
      period: "01/2018-06/2018"
      filename: DRIAMS_B.tar.gz
      url: "https://zenodo.org/records/5640517/files/DRIAMS_B.tar.gz?download=1"
      size_bytes: 3688166065
      checksum_type: md5
      checksum: 86ef245c53b1a2cf547d04dee1dc79ea
    C:
      site: DRIAMS-C
      institution: Canton Hospital Aarau
      period: "01/2018-08/2018"
      filename: DRIAMS_C.tar.gz
      # Dryad blocks scripted downloads (HTTP 401/403). Download it in a browser from the
      # page below, then register it with:
      #   python scripts/download_driams.py --site C --from-file <path-to-downloaded-file>
      url: null
      manual_download_page: "https://datadryad.org/dataset/doi:10.5061/dryad.bzkh1899q"
      size_bytes: 12433273727
      checksum_type: sha256
      checksum: 77c8097eeb09e9c07397d94b5d888684ca5421d76e4567e1d67fdd75685b7867
    D:
      site: DRIAMS-D
      institution: Viollier AG (diagnostic laboratory)
      period: "01/2018-06/2018"
      filename: DRIAMS_D.tar.gz
      url: "https://zenodo.org/records/5640517/files/DRIAMS_D.tar.gz?download=1"
      size_bytes: 42557466856
      checksum_type: md5
      checksum: 21483b6232da155edc324febe5208ee1

  # Sub-folders inside every site folder (DRIAMS README).
  spectra_folders: [raw, preprocessed, binned_6000]
  id_folder: id
  # Metadata table per year: id/<year>/<year>_<suffix>.csv, first existing suffix wins.
  # Checked 2026-09-16: DRIAMS-A has both <year>_clean.csv and <year>_strat.csv for 2015-2018 with
  # the same rows and identical antibiotic values (0 differing cells); strat adds acquisition_date,
  # acquisition_time, case_no, order_no, patient_no and workstation. DRIAMS-B only has clean.
  id_suffixes: [strat, clean]
  # Non-antibiotic columns. patient_no / case_no / order_no are 32-character hashes that never
  # repeat across DRIAMS-A years (re-hashed per year), so patients can only be grouped within a year.
  # Not every site has every column: DRIAMS-B has only species, code and combined_code (empty);
  # DRIAMS-D (checked 2026-09-17) has only code, species and genus.
  metadata_columns: [id, code, combined_code, species, genus, laboratory_species, patient_no, case_no, order_no,
                     acquisition_date, acquisition_time, workstation]
  # Grouping key for leakage checks (first column present wins).
  group_columns: [patient_no, case_no]
  # Leftover pandas index columns such as "Unnamed: 0" (DRIAMS-A 2018) are ignored.
  index_artifact_prefix: "Unnamed:"
  # Antibiotic names are NOT fully harmonised across sites (checked 2026-09-16): DRIAMS-A uses
  # Cotrimoxazole / Ampicillin-Amoxicillin / Fosfomycin-Trometamol where DRIAMS-B uses Cotrimoxazol /
  # Ampicillin / Fosfomycin. Ciprofloxacin and Ceftriaxone are spelled identically. No automatic
  # renaming is done; any mapping must be added explicitly and justified.
  # Screening results stored as 0/1 instead of R/I/S (DRIAMS-B: ESBL, MRSA, Cefoxitin_screen,
  # Clindamycin_induced). Reported separately; never used as antibiotic targets.
  binary_marker_values: ["0", "1"]
  # Species entries that are identification failures or mixed cultures (seen in DRIAMS-B).
  failed_identification_species: ["no peaks found"]
  mixed_species_prefix: "MIX!"
  # binned_6000 files: header "bin_index binned_intensity", 6000 rows (verified on DRIAMS-B).
  n_bins: 6000

labels:
  # Susceptible = 0, Resistant = 1.
  # Weis et al. (2022) labelled intermediate (I) as resistant (class 1). We follow that
  # convention and report I counts separately so its effect is visible.
  intermediate_as: resistant        # resistant | susceptible | exclude
  # Bracketed / mixed entries are ambiguous (maldi-learn maps them to NaN).
  ambiguous_values: ["S(2)", "R(1)", "R(2)", "L(1)", "I(1)", "I(1), S(1)", "R(1), I(1)",
                     "R(1), S(1)", "R(1), I(1), S(1)"]
  missing_values: ["-", ""]

target:
  species: Escherichia coli
  preferred_antibiotic: Ciprofloxacin
  # Sanity-check pair reported next to the main pair: Weis et al. (2022) report AUROC 0.74 for
  # E. coli + Ceftriaxone on DRIAMS-A, which gives our later models a published reference point.
  benchmark_antibiotic: Ceftriaxone

# Pre-registered eligibility rules for choosing the species-antibiotic pair.
# Fixed BEFORE looking at DRIAMS-A so the choice is not tuned to the results.
pair_selection:
  development_site: DRIAMS-A
  min_resistant_dev: 500            # class-1 samples (R, plus I when intermediate_as=resistant)
  min_susceptible_dev: 500
  min_minority_fraction: 0.10
  min_years_with_labels: 3          # out of the DRIAMS-A years
  temporal_test_year: "2018"
  min_resistant_test_year: 50
  external_sites: [DRIAMS-B, DRIAMS-C, DRIAMS-D]
  min_per_class_external: 30
  min_external_sites: 2

extraction:
  # Folders pulled out of each archive in V0.1 (raw spectra are extracted per species in V0.2).
  default_folders: [id, binned_6000]
  min_free_disk_gb: 20

# ------------------------------------------------------------------------------------------------
# Version 0.2 - spectrum preprocessing (stateless: every spectrum is processed on its own).
# Reproduces the DRIAMS pipeline: R scripts amr_maldi_ml/DRIAMS_preprocessing/*_preprocessed.r in
# BorgwardtLab/maldi_amr, run with MALDIquant (algorithms checked against MALDIquant 1.22.3):
#   transformIntensity(sqrt) -> smoothIntensity(SavitzkyGolay, halfWindowSize=10)
#   -> removeBaseline(removeBaseline(., SNIP, iterations=20))   # outer call = SNIP, 100 iterations
#   -> calibrateIntensity(TIC over the full spectrum) -> trim(2000, 20000)
# plus DRIAMS binning: sum of intensities in 3 Da bins [2000, 20000] -> 6000 features.
# Checked on 25 DRIAMS-B E. coli spectra: max relative difference 7.6e-14 to the published
# preprocessed and binned_6000 files (a single SNIP pass differs by 5e-5).
# ------------------------------------------------------------------------------------------------
preprocessing:
  spectrum_folder: raw              # input folder inside each site
  min_raw_points: 100               # fewer points = malformed spectrum
  intensity_transform: sqrt         # sqrt | none
  smoothing:
    method: savitzky_golay          # savitzky_golay | none
    half_window_size: 10
    polynomial_order: 3
  baseline:
    method: snip                    # snip | none
    iterations: [20, 100]           # applied one after another, as in the DRIAMS scripts
  normalization: tic                # tic | none   (trapezoidal area of the whole spectrum)
  mz_min: 2000.0
  mz_max: 20000.0
  bin_width: 3.0                    # (mz_max - mz_min) / bin_width must be a whole number
  dtype: float32

dataset:
  name: ecoli_ciprofloxacin         # output folder under output_dir
  output_dir: data/processed        # git-ignored
  # species and antibiotic come from target.species / target.preferred_antibiotic;
  # the intermediate (I) policy comes from labels.intermediate_as.
  sites: [DRIAMS-A, DRIAMS-B, DRIAMS-D]   # add DRIAMS-C here once downloaded and extracted
  # Screening samples excluded from the primary cohort (kept in the exclusion list, never deleted).
  # Sites without a workstation column (DRIAMS-B, DRIAMS-D) cannot be filtered this way.
  exclude_workstations: [HospitalHygiene]
  require_acquisition_date: false   # only temporal splits need it; they check it themselves
  flag_duplicate_spectra: true      # identical processed vectors: keep the first, exclude the rest
  # Compare every processed spectrum with the published DRIAMS binned_6000 file for the same code
  # (only when the preprocessing settings are the DRIAMS ones). Checked 2026-09-16: 4,472 of 4,483
  # E. coli ciprofloxacin spectra agree to <= 5e-8; 11 DRIAMS-A codes differ by 6-38 % because the
  # raw and the binned file hold different measurements, so the label cannot be tied to the raw file.
  verify_against_driams_binned: true
  verification_tolerance: 1.0e-4    # max |ours - DRIAMS| / max(DRIAMS)
  chunk_size: 256                   # spectra processed before flushing to disk

splits:
  # All splits keep patient groups together where a patient ID exists (DRIAMS-A: patient_no,
  # which is re-hashed per year folder, so the same person in two years cannot be detected).
  # Only the primary dataset (dataset.name) gets these splits; every other dataset built from the
  # same data (e.g. --intermediate-as exclude) reuses the primary dataset's saved splits.
  random:
    sites: [DRIAMS-A]
    test_fraction: 0.2
    validation_fraction: 0.1        # of all samples, taken from the non-test part
  within_year:
    # Like `random`, but inside one year folder, where patient_no is consistent, so no patient can be
    # in two parts. Comparing it with `random` shows how much cross-year patient overlap may inflate
    # random-split results. Checked 2026-09-17: 76 % of DRIAMS-A E. coli spectra (3,247 / 4,259) come
    # from patients with more than one spectrum in the same year. 2017 is the largest year folder
    # (1,833 samples, 428 resistant, 865 patient groups).
    sites: [DRIAMS-A]
    year_folder: "2017"             # a grouping scope, not a time split (those use acquisition_date)
    test_fraction: 0.2
    validation_fraction: 0.1
  temporal:
    sites: [DRIAMS-A]
    date_column: acquisition_date   # never the year folder
    validation_start: "2017-10-01"  # train < validation_start <= validation < test_start
    test_start: "2018-01-01"
  external:
    train_sites: [DRIAMS-A]
    # One test part holding every external site; results are reported per site (their resistance
    # rates differ: B 27.7 %, D 19.1 % of E. coli with a ciprofloxacin result).
    test_sites: [DRIAMS-B, DRIAMS-D]  # add DRIAMS-C when available
    validation_fraction: 0.1

evaluation:
  # Fixed in docs/evaluation_protocol.md (approved 2026-09-17) before any model was trained.
  threshold:
    rule: min_sensitivity             # highest cut-off whose validation sensitivity for resistance >= target
    min_sensitivity: 0.90
  primary_metric: roc_auc             # PR-AUC is reported next to it (co-primary)
  bootstrap:
    resamples: 2000                   # whole patient groups resampled within the test part
    level: 0.95
    seed: 42
  calibration_bins: 10                # equal-count bins for reliability plots
  # Test parts of these splits stay unused until Version 0.7 (the generalisation experiment).
  locked_test_splits: [temporal, external]
  test_log: results/experiments/test_evaluations.csv   # append-only, one row per test evaluation
  timing_samples: 200                 # validation spectra timed end to end (read + preprocess + predict)

baselines:
  # Version 0.3: fixed settings chosen before training; nothing is tuned here (tuning is Version 0.4).
  splits: [random, within_year]
  size_matched:                       # patient-overlap check: `split` trained on a patient-grouped random
    split: random                     # subsample of its training part, as large as the training part
    size_of: within_year              # of `size_of`
  seeds: [42, 43, 44, 45, 46]         # stochastic models run once per seed; seed 42 is reported and saved
  model_dir: models/v0.3              # git-ignored
  models:
    prevalence:                       # always predicts the training resistance rate (no-skill reference)
      kind: dummy
    logistic_regression:
      kind: logistic_regression
      scale: true                     # StandardScaler, fitted on training rows only
      params: {C: 1.0, max_iter: 5000}   # scikit-learn default L2 strength
    random_forest:
      kind: random_forest
      stochastic: true
      params: {n_estimators: 500}     # R randomForest default; more trees only reduce variance
    lightgbm:
      # LightGBM 4.7 defaults (100 trees, learning rate 0.1, 31 leaves, no row or column subsampling).
      # Checked 2026-09-17: with these settings training is deterministic (seeds 42 and 43 gave identical
      # probabilities), so it is trained once.
      kind: lightgbm
      params: {}

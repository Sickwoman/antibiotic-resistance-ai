name: tests

on:
  push:            # every branch, so work branches are tested before they are merged
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PyTorch first from its CPU index: the default Linux wheel drags in ~2.5 GB of CUDA libraries that
      # no runner can use. requirements.txt is installed afterwards and finds torch already satisfied.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: python -m ruff check .

      # The tests use small synthetic files only; DRIAMS is never downloaded in CI.
      # They also validate every notebook and scan saved notebook outputs for identifier-like hashes.
      - name: Run tests
        run: python -m pytest -q

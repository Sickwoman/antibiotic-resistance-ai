name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The tests use small synthetic files only; DRIAMS is never downloaded in CI.
      - name: Run tests
        run: python -m pytest -q

      - name: Validate notebook format
        run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/01_data_exploration.ipynb', as_version=4))"
